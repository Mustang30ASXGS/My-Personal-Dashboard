


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #eef2f3;
            color: #333;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .app-container {
            max-width: 450px;
            background: white;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        #clock {
            font-size: 3rem;
            font-weight: bold;
            color: #4a00e0;
            margin: 10px 0;
        }
        .todo-section {
            margin-top: 30px;
            text-align: left;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 15px;
            background-color: #00c6ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #0072ff;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px;
            background: #f9f9f9;
            margin-bottom: 8px;
            border-left: 5px solid #4a00e0;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #ff4757;
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2 id="greeting">Hello!</h2>
        <div id="clock">00:00:00</div>
        
        <div class="todo-section">
            <h3>Daily Tasks</h3>
            <div class="input-row">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="task-list"></ul>
        </div>
    </div>

    <script>
        // 1. Live Clock & Dynamic Greeting Function
        function updateDashboard() {
            const now = new Date();
            
            // Format time to standard local string
            document.getElementById('clock').textContent = now.toLocaleTimeString();
            
            // Change greeting based on time of day
            const hour = now.getHours();
            let greeting = "Good night!";
            if (hour >= 5 && hour < 12) greeting = "Good morning!";
            else if (hour >= 12 && hour < 18) greeting = "Good afternoon!";
            else if (hour >= 18 && hour < 22) greeting = "Good evening!";
            
            document.getElementById('greeting').textContent = greeting;
        }
        
        // Run clock immediately, then refresh every 1 second
        updateDashboard();
        setInterval(updateDashboard, 1000);

        // 2. Interactive To-Do List Functions
        function addTask() {
            const input = document.getElementById('task-input');
            const taskText = input.value.trim();
            
            if (taskText === "") return; // Don't add empty tasks

            const ul = document.getElementById('task-list');
            const li = document.createElement('li');
            
            // Set text and add a delete button inside the item
            li.innerHTML = `
                <span>${taskText}</span>
                <button class="delete-btn" onclick="this.parentElement.remove()">X</button>
            `;
            
            ul.appendChild(li);
            input.value = ""; // Clear input box
        }

        // Allow pressing "Enter" key to add a task
        document.getElementById('task-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>
</body>
</html>
